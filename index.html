<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>念樺理財工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif; color: #0f172a; background: #ffffff; }
  a { text-decoration: none; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 1px solid #eef1f5; position: sticky; top: 0; background: #fff; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#334155,#0f172a); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 600; overflow: hidden; flex-shrink: 0; }
  .brand-name { font-size: 17px; font-weight: 700; color: #0f172a; white-space: nowrap; }
  nav { display: flex; gap: 32px; }
  nav a { font-size: 15px; color: #475569; font-weight: 500; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  nav a.active { color: #2563eb; border-bottom-color: #2563eb; }
  nav a:hover:not(.active) { color: #0f172a; }
  .contact-btn { border: 1.5px solid #cbd5e1; color: #334155; font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: 999px; white-space: nowrap; }
  .contact-btn:hover { background: #f8fafc; }
  @media (max-width: 860px) { nav { display: none; } }

  /* Hero */
  .hero-wrap { position: relative; overflow: hidden; background: linear-gradient(160deg, #eef4ff 0%, #ffffff 55%); }
  .hero-wrap svg.deco { position: absolute; right: -40px; top: 0; width: 640px; max-width: 60%; opacity: 0.55; pointer-events: none; }
  .hero { position: relative; max-width: 1200px; margin: 0 auto; padding: 64px 40px 80px; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 48px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: #e8f0ff; color: #2563eb; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; margin-bottom: 20px; }
  .hero h1 { font-size: 40px; line-height: 1.35; font-weight: 800; color: #0f172a; margin-bottom: 18px; }
  .hero p.desc { font-size: 15px; color: #64748b; line-height: 1.7; margin-bottom: 28px; max-width: 480px; }
  .hero-actions { display: flex; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 26px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-outline { background: #fff; color: #334155; border: 1.5px solid #cbd5e1; }
  .btn-outline:hover { background: #f8fafc; }

  /* Preview card */
  .preview-card { position: relative; background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 20px 45px -15px rgba(15,23,42,0.18); border: 1px solid #f1f5f9; }
  .preview-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .preview-icon { width: 34px; height: 34px; border-radius: 10px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .preview-head h3 { font-size: 15px; font-weight: 700; color: #0f172a; }
  .preview-label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
  .preview-value { font-size: 34px; font-weight: 800; color: #2563eb; margin-bottom: 20px; }
  .preview-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #f1f5f9; font-size: 14px; }
  .preview-row .rk { display: flex; align-items: center; gap: 8px; color: #64748b; }
  .preview-row .rv { font-weight: 700; color: #0f172a; }
  .preview-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; background: #eef4ff; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600; color: #1d4ed8; }

  /* Tools section */
  .tools-section { max-width: 1200px; margin: 0 auto; padding: 72px 40px 90px; }
  .tools-title { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 40px; }
  .tools-title span { font-size: 22px; font-weight: 800; color: #0f172a; white-space: nowrap; }
  .tools-title .line { flex: 1; max-width: 140px; height: 1px; background: linear-gradient(to right, transparent, #cbd5e1); }
  .tools-title .line.right { background: linear-gradient(to left, transparent, #cbd5e1); }
  .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tool-card { display: flex; align-items: center; gap: 18px; background: #fff; border: 1px solid #eef1f5; border-radius: 18px; padding: 26px; box-shadow: 0 8px 24px -12px rgba(15,23,42,0.10); }
  .tool-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .tool-icon.blue { background: #e8f0ff; color: #2563eb; }
  .tool-icon.teal { background: #e3faf5; color: #0d9488; }
  .tool-info { flex: 1; }
  .tool-info h4 { font-size: 17px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .tool-info p { font-size: 13px; color: #94a3b8; }
  .tool-go { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .tool-go .circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .tool-go .circle.blue { background: #2563eb; }
  .tool-go .circle.teal { background: #0d9488; }
  .tool-go span { font-size: 12px; font-weight: 600; color: #64748b; white-space: nowrap; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .tools-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 30px; } header { padding: 14px 20px; } .hero, .tools-section { padding-left: 20px; padding-right: 20px; } }

  footer { text-align: center; padding: 26px 20px; color: #94a3b8; font-size: 13px; border-top: 1px solid #eef1f5; }
</style>
</head>
<body>
